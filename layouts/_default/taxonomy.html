{{ define "main" }}
<div class="container">
  <div class="posts-section">
    <div class="posts-header"><h3>{{ .Title }}</h3></div>
    <div class="post-grid">
      {{ range .Pages }}
      <article class="post-card">
        <div class="pc-text">
          <p class="card-tag">{{ len .Pages }} essays</p>
          <h4><a href="{{ .Permalink }}">{{ .Title }}</a></h4>
        </div>
      </article>
      {{ end }}
    </div>
  </div>
</div>
{{ end }}
