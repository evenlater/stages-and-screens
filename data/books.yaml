# Reusable bibliography library. Posts reference these keys from front
# matter’s `sources:` list (see layouts/_default/single.html).
#
# Each entry needs either a `citation` (a fully-formatted string, run
# through markdownify so *italics* work) or the author/title/publisher/
# year fields for the template’s fallback formatting. Example:
#
# brantley_the-passion-play:
#   author: "Brantley, Ben"
#   title: "The Life and Death of a Passion Play"
#   citation: "Brantley, Ben. \"The Life and Death of a Passion Play.\" *The New York Times*, 12 Apr. 2019."
#
# Left empty for the Stages & Screens launch -- add entries here as
# posts cite reviews, program notes, biographies, or other sources.
# Append these entries to the site’s existing data/books.yaml.
# Every entry below is linked or explicitly identified in one of the migrated posts.

