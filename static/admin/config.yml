# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json
#
# Sveltia CMS config for ideationalevolution.com
#
# NOT covered by this config (left as a manual step / open question):
#   - Bibliography: each book is its own file in data/books/<key>.yaml
#     (Hugo reads the folder as .Data.books, keyed by file name). The
#     "Bibliography" collection below edits those files, and a post's
#     Sources field is a search-and-pick list of them, with an Add
#     button for new books. A GitHub Action (.github/workflows/
#     sync-books.yml) copies new/changed book files to the other sites.
#
#   - `tags:` below is a fixed 3-option list (Disraeli, Gladstone,
#     Wilson) matching what's actually used across all 38 posts today.
#     hugo.toml also declares a `categories` taxonomy that no post
#     actually uses — probably vestigial; I left it out rather than
#     add an unused field, but say the word if it should come back.

backend:
  name: github
  repo: evenlater/stages-and-screens
  branch: main

media_folder: static/img
public_folder: /img

collections:
  - name: posts
    label: Posts
    label_singular: Post
    folder: content/posts
    create: true
    slug: '{{year}}-{{month}}-{{day}}-{{slug}}'
    sortable_fields: [date, title]
    fields:
      - { label: Title, name: title, widget: string }

      - label: Date
        name: date
        widget: datetime
        format: 'YYYY-MM-DD'
        time_format: false
        picker_utc: true

      - { label: Draft, name: draft, widget: boolean, default: true }

      - label: Tags
        name: tags
        widget: select
        multiple: true
        min: 1
        options: [Theater, Opera, Film, Books]

      - { label: Subtitle, name: subtitle, widget: string, required: false }

      - label: Lede (excerpt override)
        name: lede
        widget: text
        required: false
        hint: 'Leave blank to auto-generate the excerpt from the body as usual.'

      - { label: Cover Image, name: image, widget: image, required: false }

      - label: Image Fit
        name: imageFit
        widget: select
        options: ["cover", "contain"]
        required: false
        hint: "Leave blank for the normal cropped look. Use contain for images that should not be cropped."

      - label: Image Credit
        name: imageCredit
        widget: string
        required: false
        hint: 'Optional photo credit shown under the cover image, e.g. "Photo: Cory Weaver / Metropolitan Opera". Links are allowed: [Photo: Name](https://...)'

      - label: Bibliography Sources
        name: sources
        widget: relation
        collection: books
        value_field: '{{slug}}'
        search_fields: [author, title]
        display_fields: ['{{author}} — {{title}}']
        multiple: true
        required: false
        hint: >-
          Type part of an author or title to find a book. Not in the list
          yet? Click "Add" to create it here; it is copied to the other
          sites' bibliographies automatically.

      - label: Body
        name: body
        widget: markdown
        editor_components: [hl]
        modes: [rich_text, raw]

  - name: books
    label: Bibliography
    label_singular: Book
    folder: data/books
    extension: yaml
    format: yaml
    create: true
    delete: false
    identifier_field: title
    slug: '{{author}}-{{title}}'
    summary: '{{author}} — {{title}}'
    sortable_fields: [author, title, year]
    fields:
      - label: Author
        name: author
        widget: string
        hint: 'Last name first, e.g. "Wilson, August" or "Nadel, Alan, ed."'

      - { label: Title, name: title, widget: string }

      - { label: Year, name: year, widget: number, value_type: int, required: false }

      - label: Citation
        name: citation
        widget: string
        required: false
        hint: >-
          The entry exactly as it should appear on the page. Put *asterisks*
          around the title for italics, e.g.
          Wilson, August. *Fences.* New York: Plume, 1986.

      - label: City
        name: city
        widget: string
        required: false
        hint: Only used when Citation is blank.

      - label: Publisher
        name: publisher
        widget: string
        required: false
        hint: Only used when Citation is blank.

      - label: Edition
        name: edition
        widget: string
        required: false
        hint: Only used when Citation is blank.
